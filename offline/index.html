<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>五子棋 · 单机版</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1e2430">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

<!-- ======== 开始界面 ======== -->
<div id="menuScreen" class="screen active">
  <div class="menu-wrap">
    <h1 class="title">五子棋</h1>
    <p class="subtitle">单机版 · 无需联网 · 鼠标 / 触屏均可</p>

    <div class="menu-card" id="menuMain">
      <button class="btn primary big" id="pveBtn">🤖 人机对战</button>
      <button class="btn big" id="pvpBtn">👥 双人同屏</button>
      <button class="btn ghost big hidden" id="resumeBtn">▶ 继续上局</button>
      <button class="btn big install hidden" id="installBtn">📲 安装到手机桌面</button>
    </div>

    <div class="menu-card hidden" id="pveSetup">
      <div class="setup-row">
        <span class="setup-label">难度</span>
        <div class="seg" id="levelSeg">
          <button data-level="easy">简单</button>
          <button data-level="medium" class="on">中等</button>
          <button data-level="hard">困难</button>
        </div>
      </div>
      <div class="setup-row">
        <span class="setup-label">先手</span>
        <div class="seg" id="colorSeg">
          <button data-color="1" class="on">我执黑（先手）</button>
          <button data-color="2">我执白（后手）</button>
        </div>
      </div>
      <div class="setup-row btns">
        <button class="btn primary" id="startPveBtn">开始对局</button>
        <button class="btn ghost" id="backBtn">返回</button>
      </div>
      <p class="hint" id="levelDesc">中等：AI 有基本的攻防意识，适合练手。</p>
    </div>

    <div class="stats-card" id="statsBox"></div>
    <button class="link-btn" id="clearStatsBtn">清空战绩</button>
  </div>
</div>

<!-- ======== 游戏主界面 ======== -->
<div id="gameScreen" class="screen">
  <div class="topbar">
    <button class="btn small ghost" id="homeBtn">🏠 主菜单</button>
    <div id="modeInfo"></div>
    <div id="turnInfo"></div>
  </div>

  <div class="board-area">
    <canvas id="board"></canvas>
  </div>

  <div class="controls">
    <button class="btn" id="undoBtn">↩ 悔棋</button>
    <button class="btn" id="pauseBtn">⏸ 暂停</button>
    <button class="btn" id="restartBtn">🔄 重开</button>
    <button class="btn ghost" id="soundBtn">🔊 音效</button>
  </div>

  <!-- 暂停界面 -->
  <div id="pauseOverlay" class="overlay hidden">
    <div class="overlay-card">
      <h2>已暂停</h2>
      <p class="hint">按 Esc 键也可以继续</p>
      <button class="btn primary big" id="resumeGameBtn">▶ 继续游戏</button>
      <button class="btn big" id="pauseRestartBtn">🔄 重新开始</button>
      <button class="btn ghost big" id="pauseHomeBtn">🏠 返回主菜单</button>
    </div>
  </div>

  <!-- 结算界面 -->
  <div id="endOverlay" class="overlay hidden">
    <div class="overlay-card">
      <h2 id="endTitle">对局结束</h2>
      <p id="endDetail" class="end-detail"></p>
      <div id="endStats" class="end-stats"></div>
      <button class="btn primary big" id="againBtn">🔄 再来一局</button>
      <button class="btn ghost big" id="endHomeBtn">🏠 返回主菜单</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>

<script src="game.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
</body>
</html>
